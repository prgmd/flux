name: flux

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # 태스크가 실행 API 서버에 붙을 때 쓰는 서명 키. 컨테이너가 같은 값을 써야 검증이 통과한다.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-flux-local-dev-jwt-secret}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-flux-local-dev-secret-key}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy


services:
  spark-master:
    image: flux-spark
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: flux-spark-master
    command:
      - spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.create_connection(('spark-master',7077),2); s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  spark-worker:
    image: flux-spark
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    command:
      - spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 3g
      - --webui-port
      - "8081"
    volumes:
      # 워커가 parquet을 **직접 읽는다.** 드라이버가 읽어 넘겨주는 것이 아니라
      # 각 워커가 자기 몫의 파일을 연다. 이 마운트가 없으면 잡이 파일을
      # 못 찾아 죽는다.
      - ${FLUX_DATA_DIR:-./data}:/data
      # 순수 DataFrame 연산은 executor에서 JVM이 돌지만, 파이썬 UDF나
      # 모듈 참조가 끼면 워커에도 flux 패키지가 필요하다. 붙여 두는 값이
      # 안 붙여서 디버깅하는 값보다 싸다.
      - ./src:/opt/flux/src:ro
    depends_on:
      spark-master:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 4g

  spark-client:
    image: flux-spark
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    profiles: ["tools"]
    volumes:
      - ./scripts:/opt/flux/scripts:ro
      # 스크립트만 마운트하면 그 스크립트가 import하는 flux 패키지는
      # 이미지에 구워진 옛 버전이 쓰인다. 고친 모듈이 반영되지 않아
      # 같은 코드를 돌린다고 믿으면서 다른 코드를 돌리게 된다.
      - ./src:/opt/flux/src:ro
      - ./tests:/opt/flux/tests:ro
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      PYTHONPATH: /opt/flux/src
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["python", "scripts/checks/cluster_check.py"]

  postgres-serving:
    image: postgres:16
    container_name: flux-postgres-serving
    environment:
      POSTGRES_USER: ${SERVING_DB_USER:-flux}
      POSTGRES_PASSWORD: ${SERVING_DB_PASSWORD:-flux}
      POSTGRES_DB: ${SERVING_DB_NAME:-flux_serving}
    ports:
      - "5432:5432"
    volumes:
      - postgres-serving-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVING_DB_USER:-flux} -d ${SERVING_DB_NAME:-flux_serving}"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-airflow:
    image: postgres:16
    container_name: flux-postgres-airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    container_name: flux-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create           --username "${AIRFLOW_ADMIN_USER:-admin}"           --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"           --firstname flux --lastname admin --role Admin           --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    container_name: flux-airflow-apiserver
    command: api-server
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: flux-airflow-scheduler
    command: scheduler
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: flux-airflow-dag-processor
    command: dag-processor
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: flux-airflow-triggerer
    command: triggerer
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-serving-data:
  postgres-airflow-data:
