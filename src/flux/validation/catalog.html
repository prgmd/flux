<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flux 데이터 카탈로그</title>
<style>
:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#182b42;background:#f2f5fa;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#11263d;color:#fff;padding:28px 4vw 24px}header p{color:#c2d1df;max-width:980px;line-height:1.7;margin:10px 0}h1{margin:0;font-size:28px;letter-spacing:-1px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:24px 0 10px}a{color:#116477}button,input{font:inherit}button{cursor:pointer}header a{color:#a9e8f1}#stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stat{background:#233e59;border:1px solid #385069;padding:9px 14px;border-radius:8px}.notice{background:#fff5d9;color:#79550a;border:1px solid #e8d093;border-radius:9px;padding:14px 18px;line-height:1.7;margin:20px 4vw 0}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;margin:22px 4vw 40px}aside,article{background:white;border:1px solid #dbe3ed;border-radius:12px;padding:20px;min-width:0}aside{align-self:start;position:sticky;top:16px;max-height:88vh;overflow:auto}input{width:100%;border:1px solid #bdcbd9;border-radius:6px;padding:10px;margin-bottom:12px}#models{display:flex;flex-direction:column;gap:5px}.model{text-align:left;padding:10px;border:0;border-radius:6px;background:#f4f7fa;word-break:break-word;color:#30465c}.model[aria-current=true]{background:#dceef2;color:#0b5363;font-weight:700}.group{font-size:12px;color:#64768a;margin:14px 0 5px}.muted{color:#65788b;font-size:13px;line-height:1.7}.lead{line-height:1.85;margin:6px 0 16px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#ecf2f8;border-radius:6px;padding:6px 9px;font-size:12px}.links{display:flex;gap:6px;flex-wrap:wrap}.node-link{border:1px solid #cfdee9;background:#f5f9fc;border-radius:6px;padding:7px;color:#17566c;overflow-wrap:anywhere;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{background:#f7f9fc;border:1px solid #e1e7ee;border-radius:8px;padding:15px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e4eaf0;padding:10px;text-align:left;vertical-align:top}th{color:#536b81;background:#f5f8fc}td{line-height:1.65;overflow-wrap:anywhere}.status{display:inline-block;border-radius:5px;padding:2px 7px;background:#eef2f7;color:#4e6277;font-size:12px;white-space:nowrap}.pass,.success{background:#e4f3ea;color:#216242}.warn{background:#fff1cc;color:#805500}.fail,.error{background:#fce5e5;color:#a12631}.skip{background:#e9edf3;color:#5b6270}details{margin-top:18px;border-top:1px solid #e4eaf0;padding-top:14px}summary{cursor:pointer;color:#385d7a;font-weight:600}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}footer{margin:0 4vw 30px;color:#6c7c8b;font-size:12px}.empty{color:#7a8b9a;padding:8px}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible{outline:3px solid #39a4b7;outline-offset:2px}@media(max-width:950px){.layout{grid-template-columns:1fr}aside{position:static;max-height:300px}.grid{grid-template-columns:1fr}header{padding:22px 5vw}.layout{margin:18px 5vw}h1{font-size:25px}}
</style>
</head>
<body>
<header><h1>Flux 데이터 카탈로그</h1><p>음악 청취 데이터의 의미에서 모델 계보, 품질 검사와 실행 근거까지. 고정 표본의 메타데이터를 조회합니다.</p><a href="dbt/index.html">기존 dbt 문서 열기</a><span class="muted" style="color:#aabed0"> (로컬 HTTP로 열 때 사용)</span><div id="stats"></div></header>
<div class="notice" id="scope"></div>
<main class="layout"><aside><label for="search">모델과 컬럼 찾기</label><input id="search" type="search" placeholder="예: yearly, listeners, DQ010"><nav id="models" aria-label="데이터 모델"></nav></aside><article id="detail" aria-live="polite"></article></main>
<footer id="footer"></footer>
<script id="catalog-data" type="application/json">__CATALOG_JSON__</script>
<script>
const data=JSON.parse(document.getElementById('catalog-data').textContent);
const nodes=data.nodes;
let selected=Object.keys(nodes).find(k=>nodes[k].name==='monthly_song_metrics')||Object.keys(nodes)[0];
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
function add(parent,tag,text,cls){const e=element(tag,text,cls);parent.append(e);return e}
function badge(value){return element('span',value,'status '+String(value).toLowerCase())}
function heading(parent,text){return add(parent,'h3',text)}
function table(parent,headers,rows){const wrap=add(parent,'div',undefined,'scroll'),t=add(wrap,'table'),thead=add(t,'thead'),tr=add(thead,'tr');headers.forEach(h=>add(tr,'th',h));const body=add(t,'tbody');rows.forEach(row=>{const r=add(body,'tr');row.forEach(cell=>{const td=add(r,'td');if(cell instanceof Node)td.append(cell);else td.textContent=String(cell??'미기록')})});return t}
function links(parent,ids){const box=add(parent,'div',undefined,'links');if(!ids.length)add(box,'span','없음','empty');ids.forEach(id=>{const b=add(box,'button',nodes[id]?.name||id,'node-link');b.onclick=()=>select(id)})}
function renderList(){const query=document.getElementById('search').value.trim().toLowerCase(),nav=document.getElementById('models');nav.replaceChildren();for(const kind of ['source','model']){const matches=Object.values(nodes).filter(n=>n.kind===kind&&JSON.stringify([n.name,n.description,n.columns,n.rule_ids,n.upstream_rule_ids]).toLowerCase().includes(query)).sort((a,b)=>a.name.localeCompare(b.name));if(matches.length)add(nav,'div',(kind==='source'?'고정 입력':'dbt 모델')+' / '+matches.length,'group');matches.forEach(n=>{const b=add(nav,'button',n.name,'model');b.setAttribute('aria-current',String(n.id===selected));b.onclick=()=>select(n.id)})}}
function select(id){if(!nodes[id])return;selected=id;renderList();renderDetail();history.replaceState(null,'','#'+encodeURIComponent(id))}
function ruleRows(ids){return ids.map(id=>{const r=data.rules[id];return [id,r.expectation,badge(r.contract_status),badge(r.gx_contract_status),r.gx?(r.gx.success?'통과':'실패')+' / '+r.gx.expectations+'개':'GX 담당 아님',r.owner]})}
function renderDetail(){const n=nodes[selected],view=document.getElementById('detail');view.replaceChildren();add(view,'h2',n.name);add(view,'p',n.description||'설명 미작성','lead');const tags=add(view,'div',undefined,'tags');[n.kind,n.owner,'한 행 = '+(n.grain.join(' + ')||'문서 미작성')].forEach(v=>add(tags,'span',v,'tag'));heading(view,'직접 계보');const grid=add(view,'div',undefined,'grid'),up=add(grid,'div',undefined,'box'),down=add(grid,'div',undefined,'box');add(up,'strong','이 모델이 읽는 입력');links(up,n.parents);add(down,'strong','이 모델을 읽는 출력');links(down,n.children);add(view,'p','위 관계는 dbt source와 ref에서 읽었습니다. Bronze와 Silver 공정은 아래의 별도 문서 계보로 연결합니다.','muted');heading(view,'컬럼과 데이터 의미');table(view,['컬럼','자료형','의미','설명 출처'],n.columns.map(c=>[c.name,c.type,c.description,c.meaning_origin]));heading(view,'모델 실행');if(Object.keys(n.runs).length)table(view,['실행','상태','처리 시간','dbt invocation ID'],Object.entries(n.runs).map(([tag,r])=>[tag,badge(r.status),r.seconds.toFixed(3)+'초',r.invocation_id]));else add(view,'p','고정 입력은 dbt가 생성한 모델이 아니므로 모델 실행 상태가 없습니다.','muted');heading(view,'이 모델에 선언된 품질 규칙');table(view,['규칙','검사 조건','독립 계약 결과','GX 내 계약','GX 검사','책임'],ruleRows(n.rule_ids));if(!n.rule_ids.length)add(view,'p','직접 선언된 규칙이 없습니다. 상위 입력과 전체 표본의 검사를 구분해서 확인하세요.','muted');const inherited=add(view,'details');add(inherited,'summary','상위 입력에서 적용한 규칙 ('+n.upstream_rule_ids.length+')');table(inherited,['규칙','검사 조건','독립 계약 결과','GX 내 계약','GX 검사','책임'],ruleRows(n.upstream_rule_ids));heading(view,'직접 연결된 dbt 검사');add(view,'p','이 결과는 dbt 실행 결과입니다. 독립 계약과 GX 결과는 같은 검사를 뜻하지 않습니다.','muted');table(view,['검사','첫 실행','재실행','재실행 시간'],n.dbt_checks.map(t=>[t.name,badge(t.runs.build.status),badge(t.runs.rebuild.status),t.runs.rebuild.seconds.toFixed(3)+'초']));renderEvidence(view)}
function renderEvidence(view){const s=add(view,'details');s.open=true;add(s,'summary','고정 입력과 실행 이력');const r=data.execution;table(s,['항목','기록'],[['범위',data.scope],['입력 Silver 행 / 청취 수',data.population.source_rows.toLocaleString()+'행 / '+data.population.plays.toLocaleString()+'회'],['기준선 SHA-256',data.baseline_sha256],['원천 표 ID / 버전',data.context.source_state.source_id+' / '+data.context.source_state.version],['시간 기준','UTC 청취 월, 연간 청취자는 사용자 기준 재계산'],['품질 정책','알려진 30초 미만 격리, 재생 시간 결측 유지'],['계정 기준','user_name. 여러 계정이 같은 사람인지는 알 수 없음'],['사람 승인 매핑',data.context.approved_mappings+'건'],['실행 ID',r.run_id],['실행 상태',badge(r.status)],['시작 / 종료 (UTC)',r.started_at+' / '+r.finished_at],['기록된 총 경과 시간',r.seconds.toFixed(3)+'초'],['저장된 이벤트',r.event_count+'개']]);if(r.stages.length)table(s,['실행 단계','상태','단계 시간'],r.stages.map(v=>[v.name,badge(v.status),v.seconds.toFixed(3)+'초']));add(s,'p','기존 GX 보고서는 규칙 파일 지문이 없어 정책 버전과 규칙 ID로 연결합니다. 독립 품질 계약은 규칙 SHA-256까지 확인했습니다.','muted');const rules=add(view,'details');add(rules,'summary','전체 표본의 품질 규칙 17개');table(rules,['규칙','검사 조건','독립 계약 결과','GX 내 계약','GX 검사','책임'],ruleRows(Object.keys(data.rules)));const ext=add(view,'details');add(ext,'summary','Bronze에서 고정 입력까지의 문서 계보');add(ext,'p','Spark 실행에서 자동 수집한 계보가 아닙니다. 현재 공정과 고정 입력의 관계를 문서로 선언했습니다.','muted');table(ext,['공정','의미','고정 표 버전'],Object.values(data.external_lineage.nodes).map(n=>[n.name,n.description,n.pin?.version??'해당 없음']));table(ext,['입력','출력','근거'],data.external_lineage.edges.map(e=>[e.parent,nodes[e.child]?.name||e.child,'문서 선언']));const hashes=add(view,'details');add(hashes,'summary','근거 파일 지문');table(hashes,['근거','SHA-256'],Object.entries(data.evidence).map(([k,v])=>[k,v.sha256]))}
const stats=document.getElementById('stats');[['모델',data.counts.models],['입력',data.counts.sources],['마트',data.population.tables_checked],['dbt 검사',data.counts.tests],['규칙',Object.keys(data.rules).length]].forEach(([k,v])=>add(stats,'div',k+' '+v,'stat'));
const q=data.quality.summary;document.getElementById('scope').textContent='고정 표본 전용 | 품질 계약: '+Object.entries(q).map(([k,v])=>k+' '+v).join(', ')+' | 운영 반영과 자동 승격은 하지 않았습니다. 경고와 SKIP은 통과로 바꾸지 않습니다. Live, Remix, Sped Up은 구분하며 청취자 수는 계정 수입니다.';
document.getElementById('footer').textContent='생성 '+data.generated_at+' | 원본 청취 행과 계정 값은 포함하지 않습니다. 입력과 규칙이 바뀌면 다시 생성해야 하는 정적 카탈로그입니다.';
document.getElementById('search').addEventListener('input',renderList);
try{const id=decodeURIComponent(location.hash.slice(1));if(nodes[id])selected=id}catch{}
renderList();renderDetail();
</script>
</body>
</html>
