version: 2
models:
  - name: stg_monthly
    description: "P0의 사용자 이름+MSID+UTC 청취 월 단위. 재생 시간이 없는 원천도 이미 정제된 횟수에 포함한다."
    config:
      meta: {rule_ids: [DQ003, DQ004, DQ005]}
    data_tests:
      - unique_grain:
          arguments: {columns: [user_name, recording_msid, listened_month]}
    columns:
      - name: user_name
        description: "고유 계정 기준. 실제 사람 수와 같다고 보지 않는다."
        data_tests: [nonblank]
      - name: recording_msid
        description: "원래 MSID. 같은 곡의 연결은 고정 곡 사전을 따른다."
        data_tests:
          - nonblank
          - relationships:
              arguments: {to: "ref('stg_song_dimension')", field: recording_msid}
      - name: listened_month
        description: "UTC 청취 시각으로 결정한 YYYY-MM. 덤프 도착 월이 아니다."
        data_tests: [nonblank]
      - name: play_count
        description: "30초 품질 격리와 동일 사건 중복 제거 후 남은 반복 청취 횟수."
        data_tests: [positive_integer]
  - name: stg_song_dimension
    description: "고정 정책의 MSID당 한 행인 곡 사전. 이번 이전에서 연결을 추가하지 않는다."
    config:
      meta: {rule_ids: [DQ006, DQ007]}
    columns:
      - name: recording_msid
        data_tests: [nonblank, unique]
      - name: recording_mbid
        description: "누락을 허용하는 관측 recording MBID. NULL 때문에 청취를 삭제하지 않는다."
      - name: song_key
        data_tests:
          - nonblank
          - relationships:
              arguments: {to: "ref('stg_song_labels')", field: song_key}
  - name: stg_song_labels
    description: "곡 키별 이름과 보존된 버전 및 식별 상태. unmarked는 원곡 확정을 뜻하지 않는다."
    columns:
      - name: song_key
        data_tests: [nonblank, unique]
      - name: variant
        data_tests: [nonblank]
  - name: stg_song_credits
    description: "공식 메인과 피처링의 기존 귀속. 한 곡이 여러 아티스트에게 귀속될 수 있다."
    config:
      meta: {rule_ids: [DQ006]}
    data_tests:
      - unique_grain:
          arguments: {columns: [song_key, artist_mbid]}
    columns:
      - name: song_key
        data_tests:
          - nonblank
          - relationships:
              arguments: {to: "ref('stg_song_labels')", field: song_key}
      - name: artist_mbid
        data_tests: [nonblank]
  - name: int_user_monthly_songs
    description: "사용자 이름+고정 곡 키+UTC 월 단위. 같은 사용자의 여러 MSID를 먼저 합쳐 청취자를 한 번 센다."
    config:
      meta: {rule_ids: [DQ004, DQ005, DQ010]}
    data_tests:
      - unique_grain:
          arguments: {columns: [period_start, user_name, song_key]}
    columns:
      - name: period_start
        data_tests: [not_null]
      - name: user_name
        data_tests: [nonblank]
      - name: song_key
        data_tests: [nonblank]
      - name: plays
        data_tests: [positive_integer]
  - name: monthly_song_metrics
    description: "UTC 월별 곡 지표. 순위는 고유 계정 수 기준 공동 순위이며 표본 안에서 다시 계산한다."
    config:
      meta: {rule_ids: [DQ010, DQ011, DQ012, DQ013]}
    data_tests:
      - unique_grain:
          arguments: {columns: [period_start, song_key]}
    columns:
      - name: period_start
        description: "UTC 청취 월의 첫날."
        data_tests: [not_null]
      - name: song_key
        description: "고정 곡 연결 정책의 키."
        data_tests: [nonblank]
      - name: listens
        description: "월간 반복 청취 횟수 합."
        data_tests: [positive_integer]
      - name: listeners
        description: "그 달 해당 곡을 들은 서로 다른 user_name 수."
        data_tests: [positive_integer]
      - name: top_user_listens
        description: "한 계정의 최대 월간 청취 수."
      - name: top_user_share
        description: "한 계정의 최대 청취 수를 곡 전체 청취 수로 나눈 비중."
      - name: plays_per_listener
        description: "계정당 평균 청취 수."
      - name: concentration_hhi
        description: "계정별 청취 비중의 제곱합."
      - name: effective_listeners
        description: "집중도의 역수로 환산한 균등 계정 수."
      - name: song_name
        description: "고정된 대표 곡명. 동률 표시 순서는 조회 시 이름으로 정한다."
      - name: observed_artist
        description: "관측 아티스트 이름. 공식 귀속을 추가로 추론하지 않는다."
      - name: variant
        description: "Live, Remix, Sped Up 등의 보존된 버전 라벨."
      - name: identity_status
        description: "기존 정책의 곡 식별 상태. 미확인도 곡 마트에 남는다."
      - name: source_msids
        description: "곡 키를 구성한 고정 사전의 MSID 수."
      - name: listener_rank
        description: "월별 고유 계정 수 내림차순 rank. 동률은 1, 1, 3 방식."
      - name: listen_rank
        description: "월별 청취 수 내림차순의 비교용 공동 순위."
  - name: monthly_coverage
    description: "전체 표본 청취를 분모로 한 월별 공식 아티스트 귀속 범위. 공동 크레딧을 중복 가산하지 않는다."
    config:
      meta: {rule_ids: [DQ010, DQ011, DQ012]}
    columns:
      - name: period_start
        description: "UTC 청취 월의 첫날."
        data_tests: [not_null, unique]
      - name: period_listens
        description: "미연결 곡까지 포함한 월간 청취 수."
        data_tests: [positive_integer]
      - name: period_users
        description: "전체 월간 고유 계정 수."
        data_tests: [positive_integer]
      - name: linked_listens
        description: "공식 아티스트 크레딧이 하나 이상 있는 곡의 청취 수."
      - name: linked_users
        description: "귀속된 곡을 하나 이상 들은 월간 고유 계정 수."
      - name: artist_coverage
        description: "linked_listens / period_listens. 모집단의 대표성 지표가 아니다."
  - name: int_user_monthly_artists
    description: 사용자 이름+UTC 월+공식 아티스트 단위. 한 계정의 여러 곡을 합쳐 계정 중복을 막는다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - user_name
          - artist_mbid
    columns:
    - name: period_start
      description: UTC 청취 월의 첫날.
      data_tests:
      - not_null
    - name: user_name
      description: 고유 계정 기준인 원래 사용자 이름.
      data_tests:
      - nonblank
    - name: artist_mbid
      description: 고정 공식 메인 및 피처링 크레딧의 아티스트 MBID.
      data_tests:
      - nonblank
    - name: plays
      description: 여러 곡의 동일 계정 기여를 먼저 합친 월간 청취 수.
      data_tests:
      - positive_integer
  - name: int_user_monthly_variants
    description: 사용자 이름+UTC 월+보존된 버전 단위. 한 계정의 여러 곡을 합쳐 계정 중복을 막는다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - user_name
          - variant
    columns:
    - name: period_start
      description: UTC 청취 월의 첫날.
      data_tests:
      - not_null
    - name: user_name
      description: 고유 계정 기준인 원래 사용자 이름.
      data_tests:
      - nonblank
    - name: variant
      description: 고정 버전 라벨. Remix와 Sped Up 및 Live를 그대로 구분한다.
      data_tests:
      - nonblank
    - name: plays
      description: 여러 곡의 동일 계정 기여를 먼저 합친 월간 청취 수.
      data_tests:
      - positive_integer
  - name: monthly_artist_metrics
    description: UTC 월별 공식 아티스트 지표. 공동 참여자마다 횟수를 부여하므로 아티스트 합계는 전체 청취 수와 다를 수 있다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - artist_mbid
    columns:
    - &month_start
      name: period_start
      description: UTC 청취 월의 첫날.
      data_tests:
      - not_null
    - &artist_id
      name: artist_mbid
      description: 고정 공식 메인 및 피처링 크레딧의 아티스트 MBID.
      data_tests:
      - nonblank
    - &total_listens
      name: listens
      description: 월간 반복 청취 횟수 합.
      data_tests:
      - positive_integer
    - &unique_listeners
      name: listeners
      description: 그 달 해당 집계 대상을 들은 서로 다른 user_name 수.
      data_tests:
      - positive_integer
    - &maximum_user_listens
      name: top_user_listens
      description: 한 계정의 최대 월간 청취 수.
    - &maximum_user_share
      name: top_user_share
      description: 한 계정의 최대 청취 수를 해당 집계 대상 전체 청취 수로 나눈 비중.
    - &average_listens
      name: plays_per_listener
      description: 계정당 평균 청취 수.
    - &hhi
      name: concentration_hhi
      description: 계정별 청취 비중의 제곱합.
    - &effective_listener_count
      name: effective_listeners
      description: 집중도의 역수로 환산한 균등 계정 수.
    - name: artist_name
      description: 고정 크레딧에서 선택한 대표 아티스트 이름. 동률은 조회에서 이름순 정렬한다.
    - name: listener_rank
      description: 월간 고유 계정 수 기준 공동 순위. 동률은 1, 1, 3이다.
      data_tests:
      - positive_integer
    - name: listen_rank
      description: 월간 청취 수 기준 비교용 공동 순위.
      data_tests:
      - positive_integer
  - name: monthly_artist_song_metrics
    description: UTC 월+아티스트+곡 단위. 참여 아티스트마다 곡 지표와 아티스트 안의 기여 비중을 제공한다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - artist_mbid
          - song_key
    columns:
    - name: period_start
      description: UTC 청취 월의 첫날.
      data_tests:
      - not_null
    - name: song_key
      description: 고정 곡 연결 정책의 키.
      data_tests:
      - nonblank
    - name: listens
      description: 월간 반복 청취 횟수 합.
      data_tests:
      - positive_integer
    - name: listeners
      description: 그 달 해당 곡을 들은 서로 다른 user_name 수.
      data_tests:
      - positive_integer
    - name: top_user_listens
      description: 한 계정의 최대 월간 청취 수.
    - name: top_user_share
      description: 한 계정의 최대 청취 수를 해당 집계 대상 전체 청취 수로 나눈 비중.
    - name: plays_per_listener
      description: 계정당 평균 청취 수.
    - name: concentration_hhi
      description: 계정별 청취 비중의 제곱합.
    - name: effective_listeners
      description: 집중도의 역수로 환산한 균등 계정 수.
    - name: song_name
      description: 고정된 대표 곡명. 동률 표시 순서는 조회 시 이름으로 정한다.
    - name: observed_artist
      description: 관측 아티스트 이름. 공식 귀속을 추가로 추론하지 않는다.
    - name: variant
      description: Live, Remix, Sped Up 등의 보존된 버전 라벨.
    - name: identity_status
      description: 기존 정책의 곡 식별 상태. 미확인도 곡 마트에 남는다.
    - name: source_msids
      description: 곡 키를 구성한 고정 사전의 MSID 수.
    - name: listener_rank
      description: 월별 고유 계정 수 내림차순 rank. 동률은 1, 1, 3 방식.
    - name: listen_rank
      description: 월별 청취 수 내림차순의 비교용 공동 순위.
    - *artist_id
    - name: artist_name
      description: 이 곡의 고정 공식 아티스트 크레딧 이름.
    - name: song_listen_share
      description: 이 곡 청취 수 / 해당 아티스트 월간 청취 수.
    - name: song_listener_reach
      description: 이 곡 계정 수 / 해당 아티스트 월간 고유 계정 수. 곡별 도달률 합은 1을 넘을 수 있다.
    - name: artist_song_rank
      description: 해당 월과 아티스트 안에서 고유 계정 수로 매긴 공동 순위.
      data_tests:
      - positive_integer
  - name: monthly_variant_metrics
    description: UTC 월+버전 라벨 단위. 같은 계정의 여러 곡을 합쳐 버전별 고유 계정 수와 집중도를 계산한다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - variant
    columns:
    - *month_start
    - name: variant
      description: 고정 버전 라벨. Remix와 Sped Up 및 Live를 그대로 구분한다.
      data_tests:
      - nonblank
    - *total_listens
    - *unique_listeners
    - *maximum_user_listens
    - *maximum_user_share
    - *average_listens
    - *hhi
    - *effective_listener_count
    - name: listen_share
      description: 버전별 청취 수 / 전체 월간 청취 수. 미연결 곡도 포함한다.
    - name: listener_reach
      description: 버전별 고유 계정 수 / 전체 월간 고유 계정 수. 버전별 도달률을 더하면 중복 계정이 생길 수 있다.
  - name: monthly_listener_metrics
    description: UTC 월+SHA-256 계정 키 단위. 해시 키는 기존 결과와의 호환을 위한 결정적 가명이며 익명성을 보장하지 않는다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - listener_key
    columns:
    - *month_start
    - name: listener_key
      description: UTF-8 user_name의 SHA-256 소문자 16진수. 사람 수와 계정 수는 다르다.
      data_tests:
      - nonblank
    - name: listens
      description: 미연결 곡을 포함한 해당 계정의 월간 청취 수.
      data_tests:
      - positive_integer
    - name: song_count
      description: 해당 계정의 고정 곡 키 기준 월간 고유 곡 수.
      data_tests:
      - positive_integer
    - name: top_song_share
      description: 해당 계정이 가장 많이 들은 한 곡 횟수 / 그 계정 월간 청취 수.
  - name: monthly_identity_coverage
    description: UTC 월+곡 식별 상태 단위. 미연결 및 미확인 청취도 보존하며 아티스트 귀속 상태와 구분한다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - identity_status
    columns:
    - *month_start
    - name: identity_status
      description: 고정 곡 라벨의 식별 상태. 아티스트 귀속 승인 여부를 뜻하지 않는다.
      data_tests:
      - nonblank
    - name: listens
      description: 해당 식별 상태 곡들의 월간 청취 수.
      data_tests:
      - positive_integer
    - name: listeners
      description: 해당 상태의 곡을 들은 월간 고유 계정 수. 상태별 합은 전체 계정 수와 다를 수 있다.
      data_tests:
      - positive_integer
  - name: int_user_yearly_songs
    description: 사용자 이름+고정 곡 키+UTC 연도 단위. 월별 사용자별 횟수를 연간으로 합산한 뒤 계정 수와 최대 기여 및 집중도를 다시 계산한다.
    config:
      meta:
        rule_ids:
        - DQ004
        - DQ005
        - DQ010
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - user_name
          - song_key
    columns:
    - name: period_start
      data_tests:
      - not_null
    - name: user_name
      data_tests:
      - nonblank
    - name: song_key
      data_tests:
      - nonblank
    - name: plays
      data_tests:
      - positive_integer
  - name: yearly_song_metrics
    description: UTC 연간 곡 지표. 순위는 고유 계정 수 기준 공동 순위이며 표본 안에서 다시 계산한다.
    config:
      meta:
        rule_ids:
        - DQ010
        - DQ011
        - DQ012
        - DQ013
    data_tests:
    - unique_grain:
        arguments:
          columns:
          - period_start
          - song_key
    columns:
    - name: period_start
      description: UTC 청취 연도의 첫날.
      data_tests:
      - not_null
    - name: song_key
      description: 고정 곡 연결 정책의 키.
      data_tests:
      - nonblank
    - name: listens
      description: 연간 반복 청취 횟수 합.
      data_tests:
      - positive_integer
    - name: listeners
      description: 해당 연도 해당 곡을 들은 서로 다른 user_name 수.
      data_tests:
      - positive_integer
    - name: top_user_listens
