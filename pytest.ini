[pytest]
pythonpath = src
testpaths = tests

# 기본 실행은 Spark도 스택도 없이 도는 것만 고른다.
# 호스트에 JDK 17+가 없으면 Spark 4.x가 뜨지 않으므로 spark도 빠진다.
addopts = -m "not cluster and not spark"

markers =
    cluster: docker compose 스택(Spark, PostgreSQL, Airflow)이 필요한 통합 테스트
    spark: 작은 로컬 Spark 세션이 필요한 번역 테스트. 이미지 안에서 돌린다
