[pytest]
pythonpath = src
testpaths = tests

# 기본 실행은 Spark도 스택도 없이 도는 것만 고른다.
# 호스트에 JDK 17+가 없으면 Spark 4.x가 뜨지 않으므로 spark도 빠진다.
addopts = -m "not cluster and not spark and not dbt and not gx"

markers =
    delta_restore: 별도 Delta 리더 환경의 실제 백업 복원과 이력 검증
    cluster: docker compose 스택(Spark, PostgreSQL, Airflow)이 필요한 통합 테스트
    spark: 작은 로컬 Spark 세션이 필요한 번역 테스트. 이미지 안에서 돌린다
    dbt: 별도 dbt 환경에서 모델과 데이터 테스트 및 문서 생성을 실행한다
    gx: 별도 GX 환경에서 실제 품질 검사와 로컬 문서 및 결과 전환을 검증한다
